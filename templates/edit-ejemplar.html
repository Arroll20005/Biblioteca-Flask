{% extends 'layout.html' %}
{% block body %}

<div class="col-md-4 offset-md-4">
    <div class="card card-body">
        <h3 class="text-center">
            Actualizar Ejemplar
        </h3>
        <hr>
        <form action="/update_ejemplar/{{ejemplar.0}}" method="POST">
            <div class="form-group">
                <label class="form-label">
                    Libro
                </label>
                <input type="text" class="form-control" value="{{ ejemplar.1 }}" readonly>
                <label class="form-label">
                    Número de copia
                </label>
                <input type="text" class="form-control" value="{{ ejemplar.2 }}" readonly>
                <label class="form-label">
                    Estado
                </label>
                <select name="estado" class="form-control">
                    <option value="Disponible"
                        {% if ejemplar.3 == 'Disponible' %}
                        selected
                        {% endif %}>
                        Disponible
                    </option>
                    <option value="Prestado"
                        {% if ejemplar.3 == 'Prestado' %}
                        selected
                        {% endif %}>
                        Prestado
                    </option>
                </select>
            </div>
            <div class="form-group text-center">
                <button type="submit" class="btn btn-primary w-100 mt-3">
                    Save
                </button>
            </div>
        </form>
    </div>
</div>

{% endblock %}
