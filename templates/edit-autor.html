{% extends 'layout.html' %}
{% block body %}

<div class="col-md-4 offset-md-4">
    <div class="card card-body">
        <h3 class="text-center">
                Actualizar Autor
            </h3>
            <hr>
        <form action="/update_autor/{{autor.0}}" method="POST">
            <div class="form-group">
                <input type="text" name="nombre" required placeholder="nombre" value="{{ autor.1 }}" class="form-control">
                <input type="text" name="apellido" required placeholder="apellido" value="{{ autor.2 }}" class="form-control">
                <input type="text" name="nacionalidad" required placeholder="nacionalidad" value="{{ autor.3}}" class="form-control">

            </div>
            <div class="form-group">
                <button type="submit" class="btn btn-success w-100 mt-3">
                    Save
                </button>
            </div>
        </form>
    </div>
</div>

{% endblock %}
